name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, for example v0.20.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: markjoyeuxcom/prax

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve and validate version
        id: release
        shell: bash
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          version="${VERSION_INPUT}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must match vMAJOR.MINOR.PATCH, optionally with a prerelease suffix." >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality gate
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version and sources
        run: node scripts/verify-desktop-release.mjs --tag ${{ needs.resolve.outputs.version }}

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      # The same gates CI applies to main: a tag must not publish a revision
      # whose browser suite or dependency audit is red.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    name: Publish container image
    needs: [resolve, quality, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Prax
            org.opencontainers.image.description=Local-first operations workspace for tasks, runbooks, and Markdown knowledge.
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop — ${{ matrix.name }}
    needs: [resolve, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            artifact: prax-macos-arm64
            args: --bundles app,dmg
            archive_app: true
            assets: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - name: Linux x64
            platform: ubuntu-latest
            artifact: prax-linux-x64
            args: --bundles deb,appimage
            archive_app: false
            assets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Linux ARM64
            platform: ubuntu-24.04-arm
            artifact: prax-linux-arm64
            args: --bundles deb,appimage
            archive_app: false
            assets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_SIGNING_AVAILABLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux webview and smoke dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11

      - name: Install dependencies
        run: npm ci

      - name: Stage and verify production sidecar
        shell: bash
        run: |
          npm run prepare:sidecar
          npm run desktop:verify -- --tag ${{ needs.resolve.outputs.version }}

      - name: Verify Rust source and tests
        # `include_image!` writes its decoded tray icon to a cache file and reads it
        # back with `include_bytes!`. A plain `cargo test` compiles the lib and its
        # test harness concurrently, and the two expansions race on that file
        # (observed as an empty icon and a divide-by-zero in the tray test). Build
        # first, then compile the lib test harness alone.
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo build --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build signed and notarized macOS bundles
        if: startsWith(matrix.platform, 'macos') && env.APPLE_SIGNING_AVAILABLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build ${{ matrix.args }}

      - name: Build unsigned macOS verification bundles
        if: startsWith(matrix.platform, 'macos') && env.APPLE_SIGNING_AVAILABLE != 'true'
        run: npx tauri build ${{ matrix.args }}

      - name: Build desktop bundles
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        env:
          # Cargo strips Prax; linuxdeploy must preserve modern system-library ELF sections.
          NO_STRIP: "true"
        run: npx tauri build ${{ matrix.args }} --verbose

      - name: Smoke packaged runtime
        run: npm run desktop:smoke

      - name: Archive macOS application bundle
        if: matrix.archive_app
        shell: bash
        run: tar -czf src-tauri/target/release/bundle/macos/Prax-${{ matrix.artifact }}.app.tar.gz -C src-tauri/target/release/bundle/macos Prax.app

      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete release
    needs: [resolve, quality, container, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Assemble release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs --tag ${{ needs.resolve.outputs.version }} --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} > release-notes.md

      - name: Download all native packages
        uses: actions/download-artifact@v8
        with:
          pattern: prax-*
          path: release-assets
          merge-multiple: true

      - name: Flatten assets and reject filename collisions
        shell: bash
        run: |
          mkdir release-files
          find release-assets -type f -exec cp -n {} release-files/ \;
          source_count="$(find release-assets -type f | wc -l)"
          release_count="$(find release-files -type f | wc -l)"
          test "$source_count" -eq "$release_count"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-files
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Create GitHub Release with every supported package
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          name: ${{ needs.resolve.outputs.version }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
          # The body comes from CHANGELOG.md via scripts/release-notes.mjs and
          # states that the installers are unsigned (docs/desktop/BUILD.md).
          body_path: release-notes.md
