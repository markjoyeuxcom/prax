name: Desktop builds

# Full native build + packaged-runtime smoke evidence outside the release
# workflow. Tagged distribution is intentionally owned by release.yml so a
# product release cannot race ahead with missing desktop packages.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "server/**"
      - "public/**"
      - "scripts/prepare-sidecar.mjs"
      - "scripts/verify-desktop-*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            artifact: prax-macos-arm64
            args: --bundles app,dmg
            assets: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: macOS Intel
            platform: macos-13
            artifact: prax-macos-x64
            args: --bundles app,dmg
            assets: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: Windows x64
            platform: windows-latest
            artifact: prax-windows-x64
            args: --bundles msi,nsis
            assets: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            platform: ubuntu-latest
            artifact: prax-linux-x64
            args: --bundles deb,appimage
            assets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux webview and smoke dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11

      - name: Install dependencies
        run: npm ci

      - name: Verify Rust source and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Stage and verify production sidecar
        run: |
          npm run prepare:sidecar
          npm run desktop:verify

      - name: Build desktop bundles
        run: npx tauri build ${{ matrix.args }}

      - name: Smoke packaged runtime
        run: npm run desktop:smoke

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 14
