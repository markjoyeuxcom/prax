version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/London
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/London
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Europe/London
    labels:
      - dependencies
      - docker-compose
    open-pull-requests-limit: 5

  # The Tauri desktop shell's Rust crates (Cargo.toml/Cargo.lock live here).
  # Tracks the gtk-rs/glib stack so a fixed glib (0.20+) lands when Tauri moves.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/London
    labels:
      - dependencies
      - rust
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
