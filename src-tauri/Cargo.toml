[package]
name = "prax"
version = "0.36.1"
description = "Prax — tasks, notes, and runbooks in a calm desktop app"
authors = ["Mark Joyeux"]
license = "MIT"
edition = "2021"

# The webview shell around the Node/Fastify sidecar (docs/desktop/ Phase 3).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tempfile = "3"

# macOS: disable the press-and-hold accent picker for this app so held keys
# repeat in the editor (same version the tauri tree already pins).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

[lib]
name = "prax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
strip = true
