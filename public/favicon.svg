<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- Prax mark: rounded-square outline + rotated square + lowercase p.
       Static fern colours (favicons cannot read CSS variables). -->
  <rect x="1.5" y="1.5" width="25" height="25" rx="7.5" fill="none" stroke="#3E8172" stroke-width="2"/>
  <rect x="8.2" y="8.2" width="11.6" height="11.6" rx="2.6" fill="none" stroke="#3E8172" stroke-width="1.7" transform="rotate(45 14 14)"/>
  <text x="14" y="17.2" text-anchor="middle" font-family="'Instrument Sans', 'Helvetica Neue', sans-serif" font-size="9" font-weight="700" fill="#3E8172">p</text>
</svg>
