# Example CloudNativePG Cluster for Moomora Console with pgvector.
#
# This is a STARTING POINT — adapt instances/storage/registry to your cluster.
# The repo's app manifests (deploy/k8s/) consume this cluster's generated
# application secret; they do not create the database themselves.
#
# Two things make semantic search work here:
#   1. `imageName` points at the pgvector-enabled image built from
#      deploy/postgres/Dockerfile (the stock CNPG images lack pgvector).
#   2. `postInitApplicationSQL` pre-creates the `vector` extension as superuser,
#      because pgvector is not a "trusted" extension and the non-superuser app
#      role the app runs migrations as cannot CREATE it. Migration 0005's
#      `CREATE EXTENSION IF NOT EXISTS vector` then becomes a harmless no-op.
#
# Apply with:  kubectl apply -f deploy/k8s/postgres-cluster.example.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: moomora-console-db
  # ^ CloudNativePG generates the `moomora-console-db-app` secret from this name;
  #   that is the secret deploy/k8s/deployment.yaml reads as DATABASE_URL (uri key).
  labels:
    app.kubernetes.io/name: moomora-console
spec:
  instances: 1   # bump to 3 for a highly-available cluster

  # The pgvector image built/pushed from deploy/postgres/Dockerfile.
  # Pin to an immutable tag in production (never :latest).
  imageName: REGISTRY/moomora-pgvector:18

  storage:
    size: 5Gi
    # storageClass: <your-storage-class>   # omit to use the cluster default

  bootstrap:
    initdb:
      database: app   # CNPG default; the generated `-app` secret points at this db/user
      owner: app
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
