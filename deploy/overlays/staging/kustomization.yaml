apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/awaybreaktoday/prax
    newTag: v0.15.0
patches:
  - target:
      kind: HTTPRoute
      name: prax
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: prax-staging.example.com
