apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/awaybreaktoday/moomora-console
    newTag: v0.15.0
patches:
  - target:
      kind: HTTPRoute
      name: moomora-console
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: moomora-console.example.com
