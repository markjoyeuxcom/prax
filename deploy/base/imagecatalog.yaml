# CNPG derives the PostgreSQL major version from the image tag, but the public
# pgvector operand image tag (`0.8.2-18-trixie`) leads with the pgvector version,
# so tag-parsing fails ("Unsupported PostgreSQL version"). An ImageCatalog states
# the major version (18) explicitly, which the Cluster references via
# imageCatalogRef. Applied before the Cluster (sync-wave "-1").
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: moomora-console-pg
  labels:
    app.kubernetes.io/name: moomora-console
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  images:
    - major: 18
      image: ghcr.io/cloudnative-pg/pgvector:0.8.2-18-trixie
