apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prax
  labels:
    app.kubernetes.io/name: prax
  annotations:
    external-dns.alpha.kubernetes.io/target: "true"
spec:
  parentRefs:
    - name: external-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - prax.invalid
  rules:
    - backendRefs:
        - name: prax
          port: 3000
