# OPT-IN EXAMPLE ONLY — deliberately not included by base/kustomization.yaml.
# Prax has no built-in authentication. Add this resource only behind a Gateway
# or policy that enforces authentication and TLS for every request.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prax
  labels:
    app.kubernetes.io/name: prax
  annotations:
    external-dns.alpha.kubernetes.io/target: "true"
spec:
  parentRefs:
    - name: external-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - prax.invalid
  rules:
    - backendRefs:
        - name: prax
          port: 3000
