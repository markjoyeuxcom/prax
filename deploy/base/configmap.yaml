apiVersion: v1
kind: ConfigMap
metadata:
  name: prax-config
  labels:
    app.kubernetes.io/name: prax
data:
  HOST: "0.0.0.0"
  # The pod must listen on its network interface. This is an explicit
  # acknowledgement, not a claim that Prax provides authentication.
  PRAX_ALLOW_UNAUTHENTICATED_NETWORK: "true"
  PORT: "3000"
  PUBLIC_DIR: "/app/public"
  # External semantic processing remains opt-in.
  EMBEDDING_BACKEND: "none"
