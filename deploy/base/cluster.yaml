apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: moomora-console-db
  labels:
    app.kubernetes.io/name: moomora-console
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  # Real CNPG operand image (contains Postgres + initdb). PG 18 provides the
  # extension_control_path GUC that ImageVolume extensions rely on.
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  postgresql:
    # pgvector is mounted (read-only) from the public extension image as a
    # Kubernetes ImageVolume — NOT used as the operand. Distro/major (18, trixie)
    # must match the operand image.
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.2-18-trixie
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: app
      owner: app
      # pgvector is not a "trusted" extension, so it is created here as superuser
      # (migration 0005's CREATE EXTENSION IF NOT EXISTS vector then no-ops).
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
