apiVersion: apps/v1
kind: Deployment
metadata:
  name: prax
  labels:
    app.kubernetes.io/name: prax
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prax
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prax
    spec:
      # Prax never talks to the Kubernetes API, so the pod gets no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: prax-data
      containers:
        - name: prax
          # The tag follows this checkout's version; the pipeline publishes no
          # image, so build and push it yourself (deploy/README.md).
          image: registry.gitlab.com/markjoyeuxcom/apps/prax:v0.39.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: prax-config
          env:
            - name: PRAX_DB_FILE
              value: /data/prax.db
          ports:
            - containerPort: 3000
              name: http
          # Pending migrations run before the server listens, so an upgrade's
          # first start answers nothing until they finish. Allow ten minutes
          # (5s x 120) rather than one: a probe that kills a long migration
          # rolls it back, and the next start would begin it again.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
