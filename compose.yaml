# Prax is backed by embedded SQLite — no database service needed.
# The volume keeps prax.db (+ WAL) across container restarts.
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      HOST: 0.0.0.0
      # Required for every non-loopback process bind. This acknowledges that
      # Prax itself has no auth; the host publication below remains loopback-only.
      PRAX_ALLOW_UNAUTHENTICATED_NETWORK: "true"
      PORT: 3000
      PRAX_DB_FILE: /data/prax.db
    ports:
      # Localhost-only by default: Prax has no built-in authentication.
      - "127.0.0.1:3100:3000"
    volumes:
      - prax-data:/data

volumes:
  prax-data:
