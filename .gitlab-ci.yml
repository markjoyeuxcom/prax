# Prax pipelines on GitLab CI (the repository moved here from GitHub on 2026-09-07).
#
# What runs when:
# - Every job runs on a self-hosted group runner, so nothing costs shared-runner
#   compute minutes. The default tag is `homelab` (Linux amd64, docker executor):
#   the Node check, the unit + contract suite, the dependency audit, the Chromium
#   browser suite, the Linux desktop build, the container build and the release
#   all land there. Only the macOS build overrides it with the `macos` tag
#   (darwin arm64, Node 24, Rust stable and Xcode command line tools installed).
# - Desktop packages are automatic on release tags, MANUAL on merge requests and
#   main, never blocking there.
# - Tags vX.Y.Z or vX.Y.Z-pre: quality gate → both desktop builds with their
#   packaged-runtime smoke → multi-arch container to this project's registry →
#   a release with every package, SHA256SUMS and the CHANGELOG section as its
#   body. A missing package fails the release. If a self-hosted runner is
#   offline the tag pipeline waits for it (a stuck job fails after the runner
#   timeout) rather than releasing without its package.
#
# Contract: tests/contract/desktopReleaseWorkflow.test.js pins these rules.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, test, desktop, container, release]

variables:
  NODE_IMAGE: node:24-bookworm
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"

default:
  interruptible: true
  # Self-hosted by default; a job that needs another machine says so itself
  # (desktop-macos-arm64). The container jobs build through the runner host's
  # Docker socket, so the homelab runner's docker executor must mount it
  # (`volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]`) — no
  # privileged flag needed. The manual container-preview job on a merge request
  # is the cheap way to prove that before a release tag depends on it.
  tags: [homelab]

.rules-release-tag: &rule-release-tag
  if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

# Desktop builds: automatic on release tags, manual and non-blocking elsewhere.
.rules-desktop: &rules-desktop
  - *rule-release-tag
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
    allow_failure: true

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - node --version && npm --version
    - npm ci --prefer-offline --no-audit --no-fund

# ---- check ---------------------------------------------------------------------

node-checks:
  stage: check
  extends: .node
  script:
    - npm run check
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        node scripts/verify-desktop-release.mjs --tag "$CI_COMMIT_TAG"
      fi
    - npm test
    - npm audit --audit-level=high

# ---- test ----------------------------------------------------------------------

browser-tests:
  stage: test
  extends: .node
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/, .playwright-browsers/]
  script:
    - npx playwright install --with-deps chromium
    - CI=1 npm run test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report/]
    expire_in: 7 days

# ---- desktop -------------------------------------------------------------------

# Linux x64 on the self-hosted `homelab` runner. The job runs in the Node image
# and installs the WebKitGTK toolchain, Rust, and the xvfb/dbus smoke harness.
desktop-linux-x64:
  stage: desktop
  image: $NODE_IMAGE
  tags: [homelab]
  needs: [node-checks]
  variables:
    # Cargo strips Prax; linuxdeploy must preserve modern system-library ELF sections.
    NO_STRIP: "true"
    # AppImage tooling cannot mount FUSE inside a container.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key:
        files: [src-tauri/Cargo.lock]
      paths: [.cargo/registry/, .cargo/git/]
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      patchelf xvfb xauth dbus-x11 build-essential pkg-config libssl-dev curl file ca-certificates
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt
    - export PATH="$CARGO_HOME/bin:$PATH"
    - node --version && cargo --version
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run prepare:sidecar
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    # `include_image!` writes its decoded tray icon to a cache file and reads it
    # back with `include_bytes!`; building before `cargo test --lib` keeps the two
    # compilations from racing on that file.
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --manifest-path src-tauri/Cargo.toml
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles deb,appimage --verbose
    - npm run desktop:smoke
    # A missing package is fatal: cp fails when a glob matches nothing.
    - mkdir -p release-assets
    - cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
    - ls -la release-assets
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules: *rules-desktop

# macOS Apple Silicon on the self-hosted `macos` runner (a Mac with Node 24,
# Rust stable and the Xcode command line tools already installed).
desktop-macos-arm64:
  stage: desktop
  tags: [macos]
  needs: [node-checks]
  before_script:
    # The runner's shell is not a login shell: put rustup's and mise's tools on PATH.
    - export PATH="$HOME/.cargo/bin:$HOME/.local/share/mise/shims:$PATH"
    - node --version && npm --version && cargo --version && xcode-select -p
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run prepare:sidecar
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --manifest-path src-tauri/Cargo.toml
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles app,dmg
    - npm run desktop:smoke
    - mkdir -p release-assets
    - tar -czf release-assets/Prax-macos-arm64.app.tar.gz -C src-tauri/target/release/bundle/macos Prax.app
    - cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
    - ls -la release-assets
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules: *rules-desktop

# ---- container ----------------------------------------------------------------

# Multi-arch server image. `container` runs on release tags and gates the
# release; `container-preview` is a manual job on merge requests that pushes
# the same build as `mr-<iid>` (never `latest`), so a registry or buildx
# problem is found and fixed on the MR instead of on a release tag.
.container:
  stage: container
  image: docker:27
  # Host socket binding, not docker:dind: the runner mounts the host's
  # /var/run/docker.sock into the job, so the `docker` client here drives the
  # host daemon directly. No privileged executor, no dind service to start, no
  # TLS certificate dance (the named-context workaround dind needed in rc.3 goes
  # with it), and layers cache on the host between jobs. The trade is that the
  # job has the host daemon's authority — the same trust a privileged dind job
  # had — and anything it creates on the host persists: hence the per-job
  # builder name and the after_script that removes it.
  variables:
    # Pinned so nothing is inferred: without a socket the docker image's
    # entrypoint would quietly assume a dind service at tcp://docker:2375 and
    # every command would fail on DNS instead of on the real cause.
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    # `docker info` exits 0 even when the daemon is unreachable, so the guard is
    # the socket file itself, then `docker version`, which does fail honestly.
    - |
      test -S /var/run/docker.sock || {
        echo 'No Docker socket in this job: the runner must mount /var/run/docker.sock (see the `default:` comment).' >&2
        exit 1
      }
      docker version --format 'Docker {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}'
    # --password-stdin keeps the token out of the process list and the job log.
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Registers qemu for arm64 in the HOST kernel (binfmt_misc). Idempotent, and
    # it persists across jobs, so the second run is a no-op.
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    # A buildkit container on the host, named per job so a builder left behind
    # by a killed job (or a concurrent one) can never collide with this one.
    - docker buildx create --use --driver docker-container --name "prax-$CI_JOB_ID"
    - |
      version="${CI_COMMIT_TAG:-mr-$CI_MERGE_REQUEST_IID}"
      tags="-t $CI_REGISTRY_IMAGE:$version"
      case "$version" in
        *-*) ;;  # a prerelease or preview is never `latest` or a floating major/minor tag
        *)
          minor="${version%.*}"; major="${minor%.*}"
          tags="$tags -t $CI_REGISTRY_IMAGE:$minor -t $CI_REGISTRY_IMAGE:$major -t $CI_REGISTRY_IMAGE:latest"
          ;;
      esac
      # The server image stays multi-arch (amd64 + arm64 hosts) even though
      # desktop packages are x64 and Apple Silicon only. Provenance and SBOM
      # attestations are off: with them on, buildx pushed the multi-arch index
      # before the registry had the platform manifests and GitLab's registry
      # rejected it with "blob unknown to registry" (v0.21.0-rc.3).
      docker buildx build --platform linux/amd64,linux/arm64 -f deploy/Dockerfile \
        --provenance=false --sbom=false \
        --label org.opencontainers.image.title=Prax \
        --label "org.opencontainers.image.description=Local-first operations workspace for tasks, runbooks, and Markdown knowledge." \
        --label org.opencontainers.image.licenses=MIT \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache" \
        --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max" \
        $tags --push .
    - docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$version"
  after_script:
    # Runs on success and failure: the builder is a container on the HOST. A
    # job that died before creating it has nothing to remove.
    - docker buildx inspect "prax-$CI_JOB_ID" >/dev/null 2>&1 && docker buildx rm "prax-$CI_JOB_ID" || true

container:
  extends: .container
  needs: [node-checks, browser-tests, desktop-linux-x64, desktop-macos-arm64]
  rules:
    - *rule-release-tag

container-preview:
  extends: .container
  needs: [node-checks, browser-tests]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# ---- release (tags only) -------------------------------------------------------

release:
  stage: release
  image: $NODE_IMAGE
  needs:
    - node-checks
    - browser-tests
    - container
    - job: desktop-linux-x64
      artifacts: true
    - job: desktop-macos-arm64
      artifacts: true
  rules:
    - *rule-release-tag
  variables:
    # Pinned and checksummed: a `latest` download runs whatever was published
    # that day, with no way to tell a swapped binary from an upgrade. Bump both
    # together (sha256sum of release-cli-linux-amd64 for the new tag).
    RELEASE_CLI_VERSION: v0.24.0
    RELEASE_CLI_SHA256: f979ef752c648b2804051b052a3a7624e06f6fd278b077905b3a51b6e86f0221
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - curl --fail --location --output /usr/local/bin/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/$RELEASE_CLI_VERSION/release-cli-linux-amd64"
    - echo "$RELEASE_CLI_SHA256  /usr/local/bin/release-cli" | sha256sum -c -
    - chmod +x /usr/local/bin/release-cli
    - release-cli --version
  script:
    - |
      cd release-assets
      # Every supported package must be present; a collision would hide one.
      test -n "$(ls *_amd64.deb 2>/dev/null)" && test -n "$(ls *_amd64.AppImage 2>/dev/null)"
      test -n "$(ls *.dmg 2>/dev/null)" && test -n "$(ls *.app.tar.gz 2>/dev/null)"
      test -z "$(ls | sort | uniq -d)"
      sha256sum * > SHA256SUMS
      cd ..
    - node scripts/release-notes.mjs --tag "$CI_COMMIT_TAG" --image "$CI_REGISTRY_IMAGE" --assets-dir release-assets > release-notes.md
    - test -s release-notes.md
    - |
      cd release-assets
      cat SHA256SUMS
      links=""
      for file in *; do
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/prax/$CI_COMMIT_TAG/$file"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$url"
        links="$links --assets-link {\"name\":\"$file\",\"url\":\"$url\",\"link_type\":\"package\"}"
      done
      cd ..
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description release-notes.md $links
