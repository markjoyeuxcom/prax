# Prax pipelines on GitLab CI (the repository moved here from GitHub on 2026-09-07).
#
# What runs when:
# - Every job runs on a self-hosted group runner, so nothing costs shared-runner
#   compute minutes. The default tag is `homelab` (Linux amd64, docker executor):
#   the Node check, the unit + contract suite, the dependency audit, the Chromium
#   browser suite, the Linux desktop build and the release all land there. Only the macOS build overrides it with the `macos` tag
#   (an Apple Silicon Mac running gitlab-runner with the Tart custom executor:
#   every job gets a throwaway macOS VM cloned from its `image:`, so that job
#   puts its own toolchain on PATH and installs what the image lacks).
# - Desktop packages are automatic on release tags, MANUAL on merge requests and
#   main, never blocking there.
# - Tags vX.Y.Z or vX.Y.Z-pre: quality gate → both desktop builds (pinned,
#   checksummed Node; pinned Rust; --locked) with their packaged-runtime smoke
#   and per-job checksums → a release with every package, SHA256SUMS and the
#   CHANGELOG section as its body. No container image is built or published:
#   the desktop app is the product; deploy/Dockerfile stays for self-builds. A missing package fails the release. If a self-hosted runner is
#   offline the tag pipeline waits for it (a stuck job fails after the runner
#   timeout) rather than releasing without its package.
#
# Contract: tests/contract/desktopReleaseWorkflow.test.js pins these rules.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, test, desktop, release]

variables:
  # The image for the check, test and release jobs. It ships nothing: both
  # desktop jobs install the pinned Node below and build with that instead.
  NODE_IMAGE: node:24-bookworm
  # The Node that Prax ships. scripts/prepare-sidecar.mjs copies the building
  # Node binary into each package as the sidecar, so both desktop jobs install
  # this exact official nodejs.org build, verify its checksum, and refuse to
  # continue if `node --version` reports anything else. It must be an official
  # build: Homebrew's node@24 links against @rpath/libnode.<abi>.dylib and a
  # dozen Cellar dylibs, and a .dmg built with it aborts with "Library not
  # loaded" on every Mac but the builder's (prepare-sidecar refuses it now).
  # Bump all three together from https://nodejs.org/dist/v<version>/SHASUMS256.txt.
  NODE_VERSION: "24.21.0"
  NODE_DARWIN_ARM64_SHA256: "6239d4cf92d864487ec8cd3615038f7b67e7f58b77b21cd2f09ea9fbd68065fe"
  NODE_LINUX_X64_SHA256: "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"
  # The Rust toolchain both desktop jobs build with (rustup installs exactly
  # this, and RUSTUP_TOOLCHAIN makes cargo use it); cargo builds are --locked
  # to src-tauri/Cargo.lock, so a release never resolves new crate versions.
  RUST_VERSION: "1.98.1"
  # The Tart executor clones a throwaway VM from this image for every job on the
  # `macos` runner, so the macOS build has to name one: with no `image:` here and
  # no `--default-image` in that runner's config.toml, its prepare stage fails
  # with "CUSTOM_ENV_CI_JOB_ID is missing and no --default-image was set" — the
  # executor's (mislabelled) wording for a missing job image. Pinned by digest so
  # a release is never built on an image that moved under it; this is what
  # `ghcr.io/cirruslabs/macos-tahoe-base:latest` resolved to. Bump with
  # `tart pull ghcr.io/cirruslabs/macos-tahoe-base:latest && tart list`.
  MACOS_IMAGE: ghcr.io/cirruslabs/macos-tahoe-base@sha256:1b093499716409d29e8b5336844528e1cae375db97d2ad8e5aeff78cf0da201e
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"

default:
  interruptible: true
  # Self-hosted by default; a job that needs another machine says so itself
  # (desktop-macos-arm64). Nothing here needs Docker inside the job, so the
  # runner's docker executor needs neither a privileged flag nor a socket mount.
  tags: [homelab]

.rules-release-tag: &rule-release-tag
  if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

# Desktop builds: automatic on release tags, manual and non-blocking elsewhere.
.rules-desktop: &rules-desktop
  - *rule-release-tag
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
    allow_failure: true

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - node --version && npm --version
    - npm ci --prefer-offline --no-audit --no-fund

# ---- check ---------------------------------------------------------------------

node-checks:
  stage: check
  extends: .node
  script:
    - npm run check
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        node scripts/verify-desktop-release.mjs --tag "$CI_COMMIT_TAG"
      fi
    - npm test
    - npm audit --audit-level=high

# ---- test ----------------------------------------------------------------------

browser-tests:
  stage: test
  extends: .node
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/, .playwright-browsers/]
  script:
    - npx playwright install --with-deps chromium
    - CI=1 npm run test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report/]
    expire_in: 7 days

# ---- desktop -------------------------------------------------------------------

# Linux x64 on the self-hosted `homelab` runner. The job runs in the Node image
# for its Debian userland, and installs the WebKitGTK toolchain, the pinned Node
# it ships (not the image's floating one), Rust, and the xvfb/dbus smoke harness.
desktop-linux-x64:
  stage: desktop
  image: $NODE_IMAGE
  tags: [homelab]
  needs: [node-checks]
  variables:
    # Cargo strips Prax; linuxdeploy must preserve modern system-library ELF sections.
    NO_STRIP: "true"
    # AppImage tooling cannot mount FUSE inside a container.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
    RUSTUP_TOOLCHAIN: "$RUST_VERSION"
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key:
        files: [src-tauri/Cargo.lock]
      paths: [.cargo/registry/, .cargo/git/]
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      patchelf xvfb xauth dbus-x11 build-essential pkg-config libssl-dev curl file ca-certificates xz-utils
    - |
      node_dir="node-v$NODE_VERSION-linux-x64"
      curl --fail --location --silent --show-error --output "/opt/$node_dir.tar.xz" "https://nodejs.org/dist/v$NODE_VERSION/$node_dir.tar.xz"
      echo "$NODE_LINUX_X64_SHA256  /opt/$node_dir.tar.xz" | sha256sum -c -
      tar -xJf "/opt/$node_dir.tar.xz" -C /opt
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" --component rustfmt
    - export PATH="/opt/node-v$NODE_VERSION-linux-x64/bin:$CARGO_HOME/bin:$PATH"
    # The Node on PATH is the one prepare-sidecar ships; refuse any other.
    - test "$(node --version)" = "v$NODE_VERSION"
    - node --version && npm --version && cargo --version
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    # The cargo build and test below need the staged resources and sidecar to exist.
    - npm run prepare:sidecar
    # `include_image!` writes its decoded tray icon to a cache file and reads it
    # back with `include_bytes!`; building before `cargo test --lib` keeps the two
    # compilations from racing on that file.
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --locked --manifest-path src-tauri/Cargo.toml
    - cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles deb,appimage --verbose -- --locked
    # After the build: tauri build re-stages the payload in its
    # beforeBuildCommand, so desktop:verify checks the copies it bundled.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    - npm run desktop:smoke
    # A missing package is fatal: cp fails when a glob matches nothing.
    - mkdir -p release-assets
    - cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
    # Checksums are taken here, where the packages were built and smoke-tested;
    # the release job verifies them after artifact storage.
    - (cd release-assets && sha256sum -- * > ../SHA256SUMS.linux-x64) && mv SHA256SUMS.linux-x64 release-assets/
    - ls -la release-assets && cat release-assets/SHA256SUMS.linux-x64
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules: *rules-desktop

# macOS Apple Silicon on the self-hosted `macos` runner. Every job there runs in
# a throwaway Tart VM cloned from $MACOS_IMAGE, so nothing survives between jobs
# and the toolchain is installed here rather than assumed: the cirruslabs base
# image ships the Xcode command line tools but no Rust, and its Homebrew Node is
# the wrong Node to build a package with (see NODE_VERSION).
desktop-macos-arm64:
  stage: desktop
  image: $MACOS_IMAGE
  tags: [macos]
  needs: [node-checks]
  variables:
    # The pinned Node and Rust (see the global NODE_VERSION and RUST_VERSION).
    RUSTUP_TOOLCHAIN: "$RUST_VERSION"
  before_script:
    # A fresh VM every time: PATH holds only the system directories, because the
    # job's shell is neither a login nor an interactive shell and the image's
    # profile never runs. Everything below is named explicitly for that reason.
    - |
      node_dir="node-v$NODE_VERSION-darwin-arm64"
      curl --fail --location --silent --show-error --output "$HOME/$node_dir.tar.xz" "https://nodejs.org/dist/v$NODE_VERSION/$node_dir.tar.xz"
      echo "$NODE_DARWIN_ARM64_SHA256  $HOME/$node_dir.tar.xz" | shasum -a 256 -c -
      tar -xJf "$HOME/$node_dir.tar.xz" -C "$HOME"
    - export PATH="$HOME/node-v$NODE_VERSION-darwin-arm64/bin:$HOME/.cargo/bin:$PATH"
    # Rust is not in the image. A Mac provisioned by hand keeps its rustup, but
    # still builds with the pinned toolchain.
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" --component rustfmt --no-modify-path
      fi
      rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
    # The Node on PATH is the one prepare-sidecar ships; refuse any other.
    - test "$(node --version)" = "v$NODE_VERSION"
    - node --version && npm --version && cargo --version && xcode-select -p
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    # The cargo build and test below need the staged resources and sidecar to exist.
    - npm run prepare:sidecar
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --locked --manifest-path src-tauri/Cargo.toml
    - cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles app,dmg -- --locked
    # After the build: tauri build re-stages the payload in its
    # beforeBuildCommand, so desktop:verify checks the copies it bundled.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    - npm run desktop:smoke
    - mkdir -p release-assets
    - tar -czf release-assets/Prax-macos-arm64.app.tar.gz -C src-tauri/target/release/bundle/macos Prax.app
    - cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
    - (cd release-assets && shasum -a 256 -- * > ../SHA256SUMS.macos-arm64) && mv SHA256SUMS.macos-arm64 release-assets/
    - ls -la release-assets && cat release-assets/SHA256SUMS.macos-arm64
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules: *rules-desktop

# ---- release (tags only) -------------------------------------------------------

release:
  stage: release
  image: $NODE_IMAGE
  needs:
    - node-checks
    - browser-tests
    - job: desktop-linux-x64
      artifacts: true
    - job: desktop-macos-arm64
      artifacts: true
  rules:
    - *rule-release-tag
  variables:
    # Pinned and checksummed: a `latest` download runs whatever was published
    # that day, with no way to tell a swapped binary from an upgrade. Bump both
    # together (sha256sum of release-cli-linux-amd64 for the new tag).
    RELEASE_CLI_VERSION: v0.24.0
    RELEASE_CLI_SHA256: f979ef752c648b2804051b052a3a7624e06f6fd278b077905b3a51b6e86f0221
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - curl --fail --location --output /usr/local/bin/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/$RELEASE_CLI_VERSION/release-cli-linux-amd64"
    - echo "$RELEASE_CLI_SHA256  /usr/local/bin/release-cli" | sha256sum -c -
    - chmod +x /usr/local/bin/release-cli
    - release-cli --version
  script:
    - |
      cd release-assets
      # Every supported package must be present; a collision would hide one.
      # One test per line: errexit ignores a failure before the last `&&`.
      test -n "$(ls *_amd64.deb 2>/dev/null)"
      test -n "$(ls *_amd64.AppImage 2>/dev/null)"
      test -n "$(ls *.dmg 2>/dev/null)"
      test -n "$(ls *.app.tar.gz 2>/dev/null)"
      test -z "$(ls | sort | uniq -d)"
      # Each desktop job checksummed its packages where it built them. Verify
      # those sums now, after artifact storage, and publish them as one list
      # that covers exactly the files being attached.
      test -f SHA256SUMS.linux-x64
      test -f SHA256SUMS.macos-arm64
      sha256sum -c --strict SHA256SUMS.linux-x64 SHA256SUMS.macos-arm64
      cat SHA256SUMS.linux-x64 SHA256SUMS.macos-arm64 | sort -k 2 > SHA256SUMS
      rm SHA256SUMS.linux-x64 SHA256SUMS.macos-arm64
      test "$(ls | grep -vx SHA256SUMS | sort)" = "$(awk '{print $2}' SHA256SUMS | sort)"
      cd ..
    - node scripts/release-notes.mjs --tag "$CI_COMMIT_TAG" --assets-dir release-assets > release-notes.md
    - test -s release-notes.md
    - |
      cd release-assets
      cat SHA256SUMS
      links=""
      for file in *; do
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/prax/$CI_COMMIT_TAG/$file"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$url"
        links="$links --assets-link {\"name\":\"$file\",\"url\":\"$url\",\"link_type\":\"package\"}"
      done
      cd ..
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description release-notes.md $links
