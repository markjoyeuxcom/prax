# Prax pipelines on GitLab CI (the repository moved here from GitHub on 2026-09-07).
#
# What runs when:
# - Every job runs on a self-hosted group runner, so nothing costs shared-runner
#   compute minutes. The default tag is `homelab` (Linux amd64, docker executor):
#   the Node check, the unit + contract suite, the dependency audit, the Chromium
#   browser suite, the Linux desktop build and the release all land there. Only the macOS build overrides it with the `macos` tag
#   (an Apple Silicon Mac running gitlab-runner with the Tart custom executor:
#   every job gets a throwaway macOS VM cloned from its `image:`, so that job
#   puts its own toolchain on PATH and installs what the image lacks).
# - Desktop packages are automatic on release tags, MANUAL on merge requests and
#   main, never blocking there.
# - Tags vX.Y.Z or vX.Y.Z-pre: quality gate → both desktop builds with their
#   packaged-runtime smoke → a release with every package, SHA256SUMS and the
#   CHANGELOG section as its body. No container image is built or published:
#   the desktop app is the product; deploy/Dockerfile stays for self-builds. A missing package fails the release. If a self-hosted runner is
#   offline the tag pipeline waits for it (a stuck job fails after the runner
#   timeout) rather than releasing without its package.
#
# Contract: tests/contract/desktopReleaseWorkflow.test.js pins these rules.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, test, desktop, release]

variables:
  NODE_IMAGE: node:24-bookworm
  # The Tart executor clones a throwaway VM from this image for every job on the
  # `macos` runner, so the macOS build has to name one: with no `image:` here and
  # no `--default-image` in that runner's config.toml, its prepare stage fails
  # with "CUSTOM_ENV_CI_JOB_ID is missing and no --default-image was set" — the
  # executor's (mislabelled) wording for a missing job image. Pinned by digest so
  # a release is never built on an image that moved under it; this is what
  # `ghcr.io/cirruslabs/macos-tahoe-base:latest` resolved to. Bump with
  # `tart pull ghcr.io/cirruslabs/macos-tahoe-base:latest && tart list`.
  MACOS_IMAGE: ghcr.io/cirruslabs/macos-tahoe-base@sha256:1b093499716409d29e8b5336844528e1cae375db97d2ad8e5aeff78cf0da201e
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"

default:
  interruptible: true
  # Self-hosted by default; a job that needs another machine says so itself
  # (desktop-macos-arm64). Nothing here needs Docker inside the job, so the
  # runner's docker executor needs neither a privileged flag nor a socket mount.
  tags: [homelab]

.rules-release-tag: &rule-release-tag
  if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

# Desktop builds: automatic on release tags, manual and non-blocking elsewhere.
.rules-desktop: &rules-desktop
  - *rule-release-tag
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
    allow_failure: true

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - node --version && npm --version
    - npm ci --prefer-offline --no-audit --no-fund

# ---- check ---------------------------------------------------------------------

node-checks:
  stage: check
  extends: .node
  script:
    - npm run check
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        node scripts/verify-desktop-release.mjs --tag "$CI_COMMIT_TAG"
      fi
    - npm test
    - npm audit --audit-level=high

# ---- test ----------------------------------------------------------------------

browser-tests:
  stage: test
  extends: .node
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/, .playwright-browsers/]
  script:
    - npx playwright install --with-deps chromium
    - CI=1 npm run test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report/]
    expire_in: 7 days

# ---- desktop -------------------------------------------------------------------

# Linux x64 on the self-hosted `homelab` runner. The job runs in the Node image
# and installs the WebKitGTK toolchain, Rust, and the xvfb/dbus smoke harness.
desktop-linux-x64:
  stage: desktop
  image: $NODE_IMAGE
  tags: [homelab]
  needs: [node-checks]
  variables:
    # Cargo strips Prax; linuxdeploy must preserve modern system-library ELF sections.
    NO_STRIP: "true"
    # AppImage tooling cannot mount FUSE inside a container.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key:
        files: [src-tauri/Cargo.lock]
      paths: [.cargo/registry/, .cargo/git/]
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      patchelf xvfb xauth dbus-x11 build-essential pkg-config libssl-dev curl file ca-certificates
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt
    - export PATH="$CARGO_HOME/bin:$PATH"
    - node --version && cargo --version
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run prepare:sidecar
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    # `include_image!` writes its decoded tray icon to a cache file and reads it
    # back with `include_bytes!`; building before `cargo test --lib` keeps the two
    # compilations from racing on that file.
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --manifest-path src-tauri/Cargo.toml
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles deb,appimage --verbose
    - npm run desktop:smoke
    # A missing package is fatal: cp fails when a glob matches nothing.
    - mkdir -p release-assets
    - cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
    - ls -la release-assets
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules: *rules-desktop

# macOS Apple Silicon on the self-hosted `macos` runner. Every job there runs in
# a throwaway Tart VM cloned from $MACOS_IMAGE, so nothing survives between jobs
# and the toolchain is set up here rather than assumed: the cirruslabs base image
# ships Homebrew, Node 24 and the Xcode command line tools but no Rust, and none
# of it is on PATH for a non-login shell.
desktop-macos-arm64:
  stage: desktop
  image: $MACOS_IMAGE
  tags: [macos]
  needs: [node-checks]
  before_script:
    # The job's shell is neither a login nor an interactive shell, so the VM's
    # profile never runs and PATH is only /usr/bin:/bin:/usr/sbin:/sbin. Name
    # every toolchain location: rustup's and mise's (a Mac provisioned by hand
    # keeps working) ahead of the image's Homebrew Node 24 keg.
    - export PATH="$HOME/.cargo/bin:$HOME/.local/share/mise/shims:/opt/homebrew/opt/node@24/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
    # Rust is not in the image; a provisioned Mac that already has it keeps it.
    - |
      if ! command -v cargo >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt --no-modify-path
      fi
    - node --version && npm --version && cargo --version && xcode-select -p
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run prepare:sidecar
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --manifest-path src-tauri/Cargo.toml
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles app,dmg
    - npm run desktop:smoke
    - mkdir -p release-assets
    - tar -czf release-assets/Prax-macos-arm64.app.tar.gz -C src-tauri/target/release/bundle/macos Prax.app
    - cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
    - ls -la release-assets
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules: *rules-desktop

# ---- release (tags only) -------------------------------------------------------

release:
  stage: release
  image: $NODE_IMAGE
  needs:
    - node-checks
    - browser-tests
    - job: desktop-linux-x64
      artifacts: true
    - job: desktop-macos-arm64
      artifacts: true
  rules:
    - *rule-release-tag
  variables:
    # Pinned and checksummed: a `latest` download runs whatever was published
    # that day, with no way to tell a swapped binary from an upgrade. Bump both
    # together (sha256sum of release-cli-linux-amd64 for the new tag).
    RELEASE_CLI_VERSION: v0.24.0
    RELEASE_CLI_SHA256: f979ef752c648b2804051b052a3a7624e06f6fd278b077905b3a51b6e86f0221
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - curl --fail --location --output /usr/local/bin/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/$RELEASE_CLI_VERSION/release-cli-linux-amd64"
    - echo "$RELEASE_CLI_SHA256  /usr/local/bin/release-cli" | sha256sum -c -
    - chmod +x /usr/local/bin/release-cli
    - release-cli --version
  script:
    - |
      cd release-assets
      # Every supported package must be present; a collision would hide one.
      test -n "$(ls *_amd64.deb 2>/dev/null)" && test -n "$(ls *_amd64.AppImage 2>/dev/null)"
      test -n "$(ls *.dmg 2>/dev/null)" && test -n "$(ls *.app.tar.gz 2>/dev/null)"
      test -z "$(ls | sort | uniq -d)"
      sha256sum * > SHA256SUMS
      cd ..
    - node scripts/release-notes.mjs --tag "$CI_COMMIT_TAG" --assets-dir release-assets > release-notes.md
    - test -s release-notes.md
    - |
      cd release-assets
      cat SHA256SUMS
      links=""
      for file in *; do
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/prax/$CI_COMMIT_TAG/$file"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$url"
        links="$links --assets-link {\"name\":\"$file\",\"url\":\"$url\",\"link_type\":\"package\"}"
      done
      cd ..
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description release-notes.md $links
