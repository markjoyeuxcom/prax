# Prax pipelines on GitLab CI (the repository moved here from GitHub on 2026-09-07).
#
# What runs when:
# - Merge requests and the default branch: Node syntax/bundle check, the unit +
#   contract suite, the dependency audit, and the Chromium browser suite.
# - Linux x64 desktop package: built on the self-hosted `homelab` runner;
#   automatic on release tags, MANUAL on merge requests and main, never
#   blocking. It is the one package a release cannot ship without.
# - Linux ARM64 and macOS Apple Silicon: GitLab's hosted `saas-linux-medium-arm64`
#   and `saas-macos-medium-m1` runners. On the Free plan those runners are not
#   assignable (the jobs fail at once with `no_matching_runner`), so both jobs are
#   allowed to fail on release tags and manual elsewhere. Packages they did not
#   produce are built on that platform by hand and attached to the release; the
#   release body lists exactly what the pipeline attached (docs/desktop/BUILD.md).
# - Tags vX.Y.Z or vX.Y.Z-pre: quality gate → desktop builds → multi-arch
#   container to this project's registry → a release with SHA256SUMS and the
#   CHANGELOG section plus the attached-package list as its body.
#
# Contract: tests/contract/desktopReleaseWorkflow.test.js pins these rules.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, test, desktop, container, release]

variables:
  NODE_IMAGE: node:24-bookworm
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"

default:
  interruptible: true

.rules-release-tag: &rule-release-tag
  if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - node --version && npm --version
    - npm ci --prefer-offline --no-audit --no-fund

# ---- check ---------------------------------------------------------------------

node-checks:
  stage: check
  extends: .node
  script:
    - npm run check
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        node scripts/verify-desktop-release.mjs --tag "$CI_COMMIT_TAG"
      fi
    - npm test
    - npm audit --audit-level=high

# ---- test ----------------------------------------------------------------------

browser-tests:
  stage: test
  extends: .node
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/, .playwright-browsers/]
  script:
    - npx playwright install --with-deps chromium
    - CI=1 npm run test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report/]
    expire_in: 7 days

# ---- desktop -------------------------------------------------------------------

.desktop-linux:
  stage: desktop
  image: $NODE_IMAGE
  needs: [node-checks]
  variables:
    # Cargo strips Prax; linuxdeploy must preserve modern system-library ELF sections.
    NO_STRIP: "true"
    # AppImage tooling cannot mount FUSE inside a container.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key:
        files: [src-tauri/Cargo.lock]
      paths: [.cargo/registry/, .cargo/git/]
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      patchelf xvfb xauth dbus-x11 build-essential pkg-config libssl-dev curl file ca-certificates
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt
    - export PATH="$CARGO_HOME/bin:$PATH"
    - node --version && cargo --version
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run prepare:sidecar
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    # `include_image!` writes its decoded tray icon to a cache file and reads it
    # back with `include_bytes!`; building before `cargo test --lib` keeps the two
    # compilations from racing on that file.
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --manifest-path src-tauri/Cargo.toml
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles deb,appimage --verbose
    - npm run desktop:smoke
    # A missing package is fatal: cp fails when a glob matches nothing.
    - mkdir -p release-assets
    - cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
    - ls -la release-assets
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules:
    - *rule-release-tag
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Runs on the self-hosted `homelab` group runner (Linux amd64) rather than a
# hosted runner, so it costs no compute minutes.
desktop-linux-x64:
  extends: .desktop-linux
  tags: [homelab]

# Not assignable on the Free plan (no_matching_runner); allowed to fail on tags.
desktop-linux-arm64:
  extends: .desktop-linux
  tags: [saas-linux-medium-arm64]
  rules:
    - <<: *rule-release-tag
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# GitLab's hosted Apple Silicon runner (`saas-macos-medium-m1`, billed at a
# higher compute-minute factor than Linux). Automatic on release tags but
# allowed to fail, so a plan that cannot run it never blocks a release; manual
# elsewhere. To use a self-hosted Mac instead, register a runner and change the
# tag. If the job did not run, build the .dmg on a Mac and attach it
# (docs/desktop/BUILD.md).
desktop-macos-arm64:
  stage: desktop
  tags: [saas-macos-medium-m1]
  needs: [node-checks]
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  before_script:
    # The hosted image ships Xcode tools and Homebrew; bring Node 24 and Rust.
    - brew install node@24 rustup >/dev/null && brew link --overwrite --force node@24 >/dev/null
    - rustup-init -y --profile minimal --component rustfmt >/dev/null 2>&1 || true
    - export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/node@24/bin:$PATH"
    - node --version && npm --version && cargo --version
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/node@24/bin:$PATH"
    - npm run prepare:sidecar
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm run desktop:verify -- --tag "$CI_COMMIT_TAG"
      else
        npm run desktop:verify
      fi
    - cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - cargo build --manifest-path src-tauri/Cargo.toml
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - npx tauri build --bundles app,dmg
    - npm run desktop:smoke
    - mkdir -p release-assets
    - tar -czf release-assets/Prax-macos-arm64.app.tar.gz -C src-tauri/target/release/bundle/macos Prax.app
    - cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
    - ls -la release-assets
  artifacts:
    name: "$CI_JOB_NAME"
    paths: [release-assets/]
    expire_in: 14 days
  rules:
    - <<: *rule-release-tag
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# ---- container (tags only) -----------------------------------------------------

container:
  stage: container
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # The image is multi-arch through buildx regardless of which desktop
  # packages the plan could build; only the x64 desktop build gates it.
  needs: [node-checks, browser-tests, desktop-linux-x64]
  rules:
    - *rule-release-tag
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --use --name prax
    - |
      version="$CI_COMMIT_TAG"
      tags="-t $CI_REGISTRY_IMAGE:$version"
      case "$version" in
        *-*) ;;  # a prerelease is never `latest` or a floating major/minor tag
        *)
          minor="${version%.*}"; major="${minor%.*}"
          tags="$tags -t $CI_REGISTRY_IMAGE:$minor -t $CI_REGISTRY_IMAGE:$major -t $CI_REGISTRY_IMAGE:latest"
          ;;
      esac
      docker buildx build --platform linux/amd64,linux/arm64 -f deploy/Dockerfile \
        --label org.opencontainers.image.title=Prax \
        --label "org.opencontainers.image.description=Local-first operations workspace for tasks, runbooks, and Markdown knowledge." \
        --label org.opencontainers.image.licenses=MIT \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache" \
        --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max" \
        $tags --push .

# ---- release (tags only) -------------------------------------------------------

release:
  stage: release
  image: $NODE_IMAGE
  needs:
    - node-checks
    - browser-tests
    - container
    - job: desktop-linux-x64
      artifacts: true
    - job: desktop-linux-arm64
      artifacts: true
      optional: true
    - job: desktop-macos-arm64
      artifacts: true
      optional: true
  rules:
    - *rule-release-tag
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - curl --fail --location --output /usr/local/bin/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64"
    - chmod +x /usr/local/bin/release-cli
    - release-cli --version
  script:
    - |
      cd release-assets
      # The Linux x64 packages are the ones a release cannot ship without; a
      # collision would hide one. What else is present is listed in the body.
      test -n "$(ls *_amd64.deb 2>/dev/null)" && test -n "$(ls *_amd64.AppImage 2>/dev/null)"
      test -z "$(ls | sort | uniq -d)"
      sha256sum * > SHA256SUMS
      cd ..
    - node scripts/release-notes.mjs --tag "$CI_COMMIT_TAG" --image "$CI_REGISTRY_IMAGE" --assets-dir release-assets > release-notes.md
    - test -s release-notes.md
    - |
      cd release-assets
      cat SHA256SUMS
      links=""
      for file in *; do
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/prax/$CI_COMMIT_TAG/$file"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$url"
        links="$links --assets-link {\"name\":\"$file\",\"url\":\"$url\",\"link_type\":\"package\"}"
      done
      cd ..
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description release-notes.md $links
